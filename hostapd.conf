# hostapd configuration for camcorder wifi access point

interface=wlan0
driver=nl80211

# wifi network name
ssid=Camcorder

# wifi channel
hw_mode=g
channel=6

# wpa2 security
wpa=2
wpa_passphrase=recording
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP

# other settings
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
