# dnsmasq configuration for camcorder access point

# listen only on wlan0
interface=wlan0

# dhcp range
dhcp-range=192.168.4.2,192.168.4.20,255.255.255.0,24h

# gateway
dhcp-option=3,192.168.4.1

# dns server
dhcp-option=6,192.168.4.1

# don't read /etc/resolv.conf
no-resolv

# add local domain for camcorder
domain=camcorder.local
local=/camcorder.local/

# resolve camcorder.local and www.camcorder.local to this pi
address=/camcorder.local/192.168.4.1
address=/www.camcorder.local/192.168.4.1

# log queries for debugging (optional)
log-queries
log-dhcp
